[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepwolf"
version = "0.1.0"
description = "An LLM werewolf engine: agent self-play arena and an explainable human copilot."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "JuneQQQ" }]
keywords = ["werewolf", "mafia", "llm", "agents", "social-deduction", "benchmark", "game-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/JuneQQQ/deepwolf"
Repository = "https://github.com/JuneQQQ/deepwolf"
Issues = "https://github.com/JuneQQQ/deepwolf/issues"
Changelog = "https://github.com/JuneQQQ/deepwolf/blob/main/CHANGELOG.md"

[project.scripts]
deepwolf = "deepwolf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["deepwolf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
